name: Aplicar banco no Supabase

# Roda quando as migrações mudam NA MAIN (ou manualmente: Actions → "Aplicar banco no Supabase" →
# Run workflow, escolhendo a branch). Push em outras branches NÃO aplica nada em produção: a
# migração só vai para o banco quando a branch for mesclada na main (ou por decisão manual).
# Aplica só as migrações que ainda não foram aplicadas (o Supabase CLI guarda o histórico),
# então pode rodar quantas vezes quiser. Sem o secret SUPABASE_DB_URL, não faz nada.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/aplicar-banco.yml"
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      # String de conexão "Session pooler" do painel (botão Connect), com a senha do banco.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir secret
        if: env.SUPABASE_DB_URL == ''
        run: echo "::warning::Sem o secret SUPABASE_DB_URL — nada a aplicar."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_DB_URL != ''
        with:
          version: latest
      - name: Migrações pendentes
        if: env.SUPABASE_DB_URL != ''
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Aplicar migrações
        if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      - name: Testar conexão e migrações pela API
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_URL != ''
        run: scripts/testar-conexao-supabase.sh
