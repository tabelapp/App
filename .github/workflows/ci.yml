name: CI

on:
  push:
  pull_request:

jobs:
  banco:
    name: Banco (migrações + testes SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/testar-banco.sh

  android:
    name: App Android (testes + APK de debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes das regras de negócio
        run: ./gradlew :core:test --stacktrace
      - name: Compilar APK (modo demonstração)
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tabelapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
