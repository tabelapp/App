name: CI

on:
  push:
  pull_request:

jobs:
  banco:
    name: Banco (migrações + testes SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/testar-banco.sh
      - name: instalar_tudo.sql em dia com as migrações
        run: scripts/juntar-migracoes.sh --conferir

  android:
    name: App Android (testes + APK de debug)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes das regras de negócio
        run: ./gradlew :core:test --stacktrace
      - name: Compilar APK (modo demonstração)
        env:
          SUPABASE_URL: ''
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          mkdir -p saida/demo && cp app/build/outputs/apk/debug/*.apk saida/demo/tabelapp-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tabelapp-demo-apk
          path: saida/demo/*.apk
      # APK ligado ao Supabase de verdade. URL e chave publicável vêm dos secrets do
      # repositório (a chave publicável é feita para ir dentro do app; nunca a secreta).
      - name: Compilar APK ligado ao Supabase
        if: env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          mkdir -p saida/real && cp app/build/outputs/apk/debug/*.apk saida/real/tabelapp.apk
      - uses: actions/upload-artifact@v4
        if: env.SUPABASE_URL != ''
        with:
          name: tabelapp-apk
          path: saida/real/*.apk

  supabase:
    name: Conexão com o Supabase (se configurado)
    runs-on: ubuntu-latest
    env:
      # Cadastre em Settings → Secrets and variables → Actions. Sem eles, o passo é pulado.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Testar conexão e migrações
        if: env.SUPABASE_URL != ''
        run: scripts/testar-conexao-supabase.sh
