name: Versão para a Play Store

# Gera o pacote para a Play Store (AAB) e um APK de produção para testar no celular.
# Rodar em Actions → "Versão para a Play Store" → Run workflow, informando o nome da
# versão (ex.: 1.0.0). O número interno (versionCode) sobe sozinho a cada execução.
#
# Secrets usados (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_WEB_CLIENT_ID, MAPS_API_KEY — os mesmos do CI;
#   ASSINATURA_KEYSTORE_BASE64, ASSINATURA_SENHA, ASSINATURA_ALIAS — a chave de envio
#   (passo a passo em docs/PLAY_STORE.md). Sem a chave, o pacote sai SEM assinatura:
#   confere que compila, mas a Play Store não aceita.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Nome da versão (ex.: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  pacote:
    name: AAB + APK de produção
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      # Contador desta automação (+100 no passo seguinte): sempre maior que o anterior.
      VERSAO_CODIGO: ${{ github.run_number }}
      VERSAO_NOME: ${{ inputs.versao }}
      TEM_CHAVE: ${{ secrets.ASSINATURA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir configuração
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL / SUPABASE_ANON_KEY: a versão de produção não pode sair em modo demonstração."
            exit 1
          fi
          [ -n "$MAPS_API_KEY" ] || echo "::warning::Sem MAPS_API_KEY: o 'Ver no mapa' vai avisar que o mapa não está configurado."
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] || echo "::warning::Sem GOOGLE_WEB_CLIENT_ID: o login com Google não vai funcionar."
          echo "VERSAO_CODIGO=$((100 + VERSAO_CODIGO))" >> "$GITHUB_ENV"

      - name: Montar a chave de envio
        if: env.TEM_CHAVE == 'true'
        env:
          ASSINATURA_KEYSTORE_BASE64: ${{ secrets.ASSINATURA_KEYSTORE_BASE64 }}
        run: |
          echo "$ASSINATURA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/envio.jks"
          echo "ASSINATURA_ARQUIVO=$RUNNER_TEMP/envio.jks" >> "$GITHUB_ENV"

      - name: Sem chave de envio
        if: env.TEM_CHAVE != 'true'
        run: |
          echo "::warning::Sem a chave de envio (ASSINATURA_*): o AAB sai sem assinatura e a Play Store não aceita. Veja docs/PLAY_STORE.md."

      - name: Testes das regras de negócio
        run: ./gradlew :core:test --stacktrace

      - name: Gerar AAB e APK de produção
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
          ASSINATURA_ALIAS: ${{ secrets.ASSINATURA_ALIAS }}
          ASSINATURA_SENHA_CHAVE: ${{ secrets.ASSINATURA_SENHA_CHAVE }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          mkdir -p saida
          cp app/build/outputs/bundle/release/*.aab "saida/tabelapp-$VERSAO_NOME-$VERSAO_CODIGO.aab"
          cp app/build/outputs/apk/release/*.apk "saida/tabelapp-$VERSAO_NOME-$VERSAO_CODIGO.apk"
          echo "### Versão $VERSAO_NOME (código $VERSAO_CODIGO)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEM_CHAVE" = "true" ]; then
            echo "Assinada com a chave de envio. Impressão digital (SHA-1) da chave de envio:" >> "$GITHUB_STEP_SUMMARY"
            keytool -list -v -keystore "$ASSINATURA_ARQUIVO" -storepass "$ASSINATURA_SENHA" -alias "$ASSINATURA_ALIAS" \
              | grep -E "SHA1:|SHA-1:" | head -1 | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Sem assinatura** — cadastre a chave de envio (docs/PLAY_STORE.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apagar a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/envio.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tabelapp-play-store
          path: saida/*
